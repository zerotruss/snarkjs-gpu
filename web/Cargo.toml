[package]
name = "zk-gpu-web"
version = "0.1.0"
edition = "2021"
description = "WebAssembly build of the zk-gpu snarkjs engine: runs on the browser's WebGPU"
license = "GPL-3.0-or-later"
rust-version = "1.92"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
zk-gpu-engine = { path = "../engine", version = "0.1.0" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
