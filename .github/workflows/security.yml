# Known vulnerabilities, licences and secrets. Also runs weekly, because new advisories appear
# without any change to this repository.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: cargo-deny (advisories, licences, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  audit:
    name: cargo-audit (RustSec advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit Cargo.lock
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit

  npm-audit:
    name: npm audit (what the package ships)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit the production dependencies
        # The package has no dependencies (snarkjs is an optional peer dependency), so this is expected to be empty.
        # Test tools are dev dependencies and are reported by Dependabot, not gated here.
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --omit=peer
      - name: Every package in the lock file comes from the npm registry, and the registry signatures check out
        run: |
          node -e "
            const packages = require('./package-lock.json').packages;
            const bad = Object.entries(packages).filter(([name, p]) => name && p.resolved && !p.resolved.startsWith('https://registry.npmjs.org/'));
            if (bad.length) { console.error('not from the npm registry:', bad.map(([n, p]) => n + ' -> ' + p.resolved)); process.exit(1); }
            console.log('all', Object.keys(packages).length - 1, 'packages resolve to https://registry.npmjs.org/');
          "
          npm audit signatures

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --results=verified,unknown
